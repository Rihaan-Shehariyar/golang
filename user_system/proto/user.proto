syntax = "proto3";

package user;

option go_package = "user/proto";

service UserService{
  rpc CreateUser(CreateUserRequest) return (UserResponse);
  rpc GetUser(GetUserRequest) return (UserResponse);
  rpc ListUser(Empty) return (ListUserResponse);
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
}

message GetUserRequest {
  int32 id = 1;
}

message UserResponse {
  User user = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

message Empty {}